[package]
name = "repo-tasks-mcp-qwen"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true

# The MCP server (and reminder hook command) launched by Qwen Code via qwen-extension.json mcpServers
[[bin]]
name = "repo-tasks-qwen-mcp"
path = "src/main.rs"

[dependencies]
repo-tasks = { path = "../../../shared/repo-tasks" }
tokio = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tokio = { workspace = true }

[package.metadata.release]
# cargo-release bumps the version in Cargo.toml, but the extension manifest carries
# it too. Rewrite it in the same commit so the two can never drift.
pre-release-replacements = [
  { file = "qwen-extension.json", search = '"version": "[0-9]+\.[0-9]+\.[0-9]+"', replace = '"version": "{{version}}"', exactly = 1 },
]

# List the shipped binary explicitly so cargo-dist ships exactly it (a map keyed by target).
[package.metadata.dist.binaries]
"*" = ["repo-tasks-qwen-mcp"]
