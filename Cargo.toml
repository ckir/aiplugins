[workspace]
resolver = "2"
members = [
    "claude-code/*",
    "antigravity/*",
    "qwen/*",
    "shared/*"
]

[workspace.package]
version = "0.6.1"
edition = "2021"
authors = ["AI Plugins Marketplace Contributors"]
license = "PolyForm-Noncommercial-1.0.0"
description = "AI Plugins and Bridges for Qwen, Claude, and Antigravity"
repository = "https://github.com/ckir/aiplugins"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
lru = "0.18"
tracing-appender = "0.2"

# Windows-only. The Ghidra worker JVM is held in a Job Object so it cannot
# outlive its parent, and the worker log is ACL'd owner-only.
#
# Pinned to the same major `rmcp` already pulls in transitively (via
# process-wrap), so the lockfile carries ONE `windows`. The ported code was
# written against 0.58; see job_object.rs and logging.rs for the two API
# differences that cost.
windows = { version = "0.62", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }

# Unix-only. Process group management for the worker lifecycle on Linux/macOS.
nix = { version = "0.29", features = ["process", "signal"] }

# Dev-only.
insta = { version = "1", features = ["json"] }
proptest = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
