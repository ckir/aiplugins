<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>{{PROJECT}} User Guide</title>
<style>
@page { size: A4; margin: 18mm 16mm; }
body { font: 10.5pt/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:#1b1f24; }
h1 { font-size: 24pt; margin: 0 0 4pt; } h2 { font-size: 16pt; border-bottom: 1px solid #d0d7de; padding-bottom: 3pt; margin-top: 22pt; break-after: avoid; }
h3 { font-size: 12.5pt; margin-top: 14pt; break-after: avoid; }
pre { background:#f6f8fa; border:1px solid #d0d7de; border-radius:5px; padding:8pt 10pt; font: 9pt/1.4 "DejaVu Sans Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-wrap: break-word; break-inside: avoid; }
code { font: 9.5pt "DejaVu Sans Mono", Menlo, Consolas, monospace; background:#f6f8fa; padding:0 2pt; border-radius:3px; } pre code { background:none; padding:0; }
.tag { display:inline-block; font:600 8pt sans-serif; padding:1pt 6pt; border-radius:8pt; vertical-align:middle; margin-left:6pt; }
.tag.ran { background:#dafbe1; color:#1a7f37; } .tag.ill { background:#fff8c5; color:#7d4e00; }
.ex { break-inside:avoid; page-break-inside:avoid; } /* wrap a short example (or one command + its output) so a page break never splits it */
pre.output { display:block; break-inside:avoid; page-break-inside:avoid; } pre.output::before { break-after:avoid; }
pre.wide { white-space: pre; font-size: 7.5pt; } /* aligned or wide output (help text, tables); keep lines under ~110 chars, a PDF cannot scroll */
table { border-collapse: collapse; width:100%; margin: 8pt 0; break-inside: avoid; } th,td { border:1px solid #d0d7de; padding:4pt 7pt; text-align:left; vertical-align:top; } th { background:#f6f8fa; }
.output::before { content:"Output"; display:block; font:600 8pt sans-serif; color:#57606a; margin-bottom:3pt; }
.output { background:#fff; border-left:3px solid #2da44e; }
.note { border-left:3px solid #0969da; background:#ddf4ff; padding:6pt 10pt; margin:8pt 0; break-inside: avoid; }
.warn { border-left:3px solid #bf8700; background:#fff8c5; padding:6pt 10pt; margin:8pt 0; break-inside: avoid; }
.cover { padding: 60mm 0 20mm; break-after: page; } .cover .sub { color:#57606a; font-size:13pt; }
nav.toc { break-after: page; } nav.toc ol { line-height:1.9; }
a { color:#0969da; text-decoration:none; }
</style></head><body>
<section class="cover"><h1>{{PROJECT}}</h1><div class="sub">User Guide &middot; version {{VERSION}} &middot; {{DATE}}</div></section>
<nav class="toc"><h2>Contents</h2><ol><li><a href="#overview">Overview</a></li></ol></nav>
<h2 id="overview">Overview</h2>
<p>…</p>
</body></html>
