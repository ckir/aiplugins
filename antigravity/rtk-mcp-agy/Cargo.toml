[package]
name = "rtk-mcp-agy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rtk-hook-preinvocation"
path = "src/bin/rtk-hook-preinvocation.rs"

[[bin]]
name = "rtk-mcp"
path = "src/bin/rtk-mcp.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# No tokio: `rtk-mcp` used to carry `#[tokio::main]` on a `main` with no `.await`
# in it, which pulled in a full async runtime to do blocking stdin reads and
# blocking `Command::output()` calls. The server is synchronous by nature — one
# request, one response, in order — so it is now a plain `fn main`.
#
# No tracing either: it was declared but never used.
