version: 2
updates:
  # Maintain dependencies for the Rust workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-all:
        patterns:
          - "*"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
          - "*"

  # Maintain OpenCode plugins (npm/bun)
  - package-ecosystem: "npm"
    directory: "/opencode/plugins/re-ghidra-mcp-opencode"
    schedule:
      interval: "weekly"
    # The wiring gate pins @opencode/plugin to the OpenCode version we test
    # against and requires every README and INSTALL.md to say the same, so only
    # a person moves it, in one change across all four plugins.
    ignore:
      - dependency-name: "@opencode/plugin"
    groups:
      npm-re-ghidra:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/opencode/plugins/rtk-mcp-opencode"
    schedule:
      interval: "weekly"
    # The wiring gate pins @opencode/plugin to the OpenCode version we test
    # against and requires every README and INSTALL.md to say the same, so only
    # a person moves it, in one change across all four plugins.
    ignore:
      - dependency-name: "@opencode/plugin"
    groups:
      npm-rtk:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/opencode/plugins/opencode-ctl-mcp-opencode"
    schedule:
      interval: "weekly"
    # The wiring gate pins @opencode/plugin to the OpenCode version we test
    # against and requires every README and INSTALL.md to say the same, so only
    # a person moves it, in one change across all four plugins.
    ignore:
      - dependency-name: "@opencode/plugin"
    groups:
      npm-opencode-ctl:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/opencode/plugins/todov2-opencode"
    schedule:
      interval: "weekly"
    # The wiring gate pins @opencode/plugin to the OpenCode version we test
    # against and requires every README and INSTALL.md to say the same, so only
    # a person moves it, in one change across all four plugins.
    ignore:
      - dependency-name: "@opencode/plugin"
    groups:
      npm-todov2:
        patterns:
          - "*"
