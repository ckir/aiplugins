name: Opencode Bundles

# Publish the installable OpenCode plugin zips.
#
# dist's own release job uploads per-target archives of the binaries — that is
# what a `cargo install`-shaped consumer wants, and it is not a plugin: no
# manifest, no skills, no hooks.json. `opencode` fetches ONE zip per
# marketplace entry and extracts it as the plugin directory, so the marketplace
# needs an asset that is the whole plugin, every platform at once.
#
# This job assembles that asset from the archives dist has already published on
# the release, and adds it to the same release. It deliberately lives outside
# .github/workflows/release.yml, which dist regenerates.
#
# Linux is not incidental: the bundles carry a /bin/sh dispatcher and unix
# binaries whose exec bits have to survive the zip, and only a unix-made zip
# entry can record them. scripts/bundle-opencode-plugin.sh refuses to run
# anywhere else.

# Deliberately NOT `release: published`. dist's announce job creates the release
# with the default GITHUB_TOKEN, and GitHub does not let a token-created release
# (or tag push) trigger another workflow — the run just never happens, with
# nothing anywhere to say why. v0.6.0 shipped without its bundles for exactly
# that reason. `workflow_run` is the supported way to chain onto another
# workflow, and it always runs the copy of this file on the default branch.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Backfill a release that predates this workflow, or re-cut bundles after a
  # fix to the bundling script.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bundle (e.g. rtk-mcp-opencode-v0.7.2)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle & upload
    # Release runs on pull_request too, where there is no release to add
    # anything to. Only a successful tag push produced one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_branch, '-opencode-v'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The plugin tree has to come from the same commit as the binaries on the
      # release, or the bundle ships a manifest for one version and binaries for
      # another.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      # Only tags cut after this workflow landed carry the bundling script, and
      # "No such file or directory" three steps later is a poor way to learn it.
      - name: Confirm the tag can be bundled
        run: |
          test -f scripts/bundle-opencode-plugin.sh || {
            echo "Tag $TAG predates scripts/bundle-opencode-plugin.sh — bundles exist from the next release onward." >&2
            exit 1
          }

      - name: Determine plugins to bundle
        id: plugins
        run: |
          names=$(jq -r '.plugins[].name' .opencode-plugin/marketplace.json | tr -d '\r' | tr '\n' ' ')
          [ -n "$names" ] || { echo "marketplace lists no plugins"; exit 1; }
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Assemble plugin bundles
        run: |
          for name in ${{ steps.plugins.outputs.names }}; do
            bash scripts/bundle-opencode-plugin.sh "opencode/$name" bundles
          done

      - name: Upload bundles to the release
        run: |
          gh release upload "$TAG" bundles/*-opencode.zip --clobber

  # Everything above ran on Linux, against a tree this workflow assembled. This
  # downloads what was actually published, extracts it the way an install does,
  # and checks the published contents — so "the zip we published installs"
  # rests on the published zip rather than on the staging tree it came from.
  verify:
    name: Verify published bundle (${{ matrix.os }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - name: Download the published bundles
        shell: bash
        run: |
          mkdir -p bundles
          for plugin in $(jq -r '.plugins[].name' .opencode-plugin/marketplace.json | tr -d '\r'); do
            gh release download "$TAG" -D bundles -p "$plugin-opencode.zip" --clobber
          done
          ls -la bundles

      - name: Extract
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # mkdir -p first: unzip -d creates only the LAST path component, so
          # extracting into extracted/<name> fails while extracted/ does not yet
          # exist. Expand-Archive creates parents, which is why only the unix
          # legs of this job failed.
          for zip in bundles/*-opencode.zip; do
            name=$(basename "$zip" -opencode.zip)
            mkdir -p "extracted/$name"
            unzip -q "$zip" -d "extracted/$name"
          done

      # Expand-Archive, not unzip: under MSYS a path with no extension resolves
      # to its sibling .exe, so `unzip` prompts to overwrite bin/<name>.exe when
      # it reaches bin/<name>. The host's own extractor has no such magic, and
      # neither does this one.
      - name: Extract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($zip in Get-ChildItem bundles\*-opencode.zip) {
            $name = $zip.Name -replace '-opencode\.zip$', ''
            Expand-Archive -Path $zip.FullName -DestinationPath "extracted\$name"
          }

      - name: Verify bundle contents
        shell: bash
        run: |
          for dir in extracted/*/; do
            name=$(basename "$dir")
            for f in plugin.ts opencode.jsonc package.json README.md INSTALL.md; do
              [ -f "$dir/$f" ] || { echo "ERROR: $dir/$f is missing from the bundle" >&2; exit 1; }
            done
            [ -d "$dir/skills" ] || { echo "ERROR: $dir/skills is missing from the bundle" >&2; exit 1; }
            jq -e . "$dir/opencode.jsonc" > /dev/null || { echo "ERROR: $dir/opencode.jsonc is not valid JSON" >&2; exit 1; }
            echo "  ok    $name bundle contents sound"
          done
