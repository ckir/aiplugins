# Re-run a finished CI run once when GitHub never gave its jobs a runner.
#
# The macOS pool is capacity-limited; a job that is "not acquired by Runner of
# type hosted even after multiple attempts" is cancelled without ever running
# (measured on run 41495365746), and the required Test (macos-latest) check then
# blocks the pull request until a human re-runs it. The decision lives in
# scripts/rerun-runner-failures.sh, which re-runs ONLY when every failed job in
# the run is such a case, so a real red job is never retried away.
#
# Bounded: attempt 1 only, so a second failure stays red for a human.
#
# This runs from the default branch (workflow_run) and executes only the script
# checked out from it; nothing from the pull request is checked out or run, and
# the only value taken from the event is the numeric run id, passed through env.
name: CI rerun on runner acquisition failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Re-run if every failed job never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash scripts/rerun-runner-failures.sh "$RUN_ID"
