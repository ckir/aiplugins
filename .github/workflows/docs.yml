name: Deploy the site and Rust docs to GitHub Pages

on:
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # A restored rust-cache must never carry a stale target/doc/index.html (the
      # old redirect) into stage-site.sh's collision guard, so drop the rustdoc
      # output before rebuilding it.
      - name: Remove stale rustdoc output
        run: cargo clean --doc

      - name: Build documentation
        # --no-deps avoids building docs for all dependencies (which is slow)
        # --document-private-items includes internal documentation
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Stage the site (storefront and rustdoc)
        run: bash scripts/stage-site.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          retention-days: 1
          # Upload the staged site: storefront at the root, rustdoc beside it
          path: 'target/site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
