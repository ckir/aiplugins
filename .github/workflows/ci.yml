name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints are platform-independent, so they run once rather than
  # once per OS in the test matrix below.
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    # The matrix is not redundancy. This workspace runs external programs whose
    # availability is platform-specific — `rtk-mcp-agy` executes commands through
    # `pwsh` on Windows and `sh` everywhere else — and a Linux-only run leaves
    # the Windows branch of that choice never actually executed. The resolver
    # logic is unit-tested for both platforms from any host; this covers the
    # spawning it cannot.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the others: which
      # platforms fail is the most useful part of a portability failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace

  wiring:
    name: Plugin Wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # Confirms every binary named in a plugin's hooks.json / .mcp.json is a
      # [[bin]] target this workspace builds. Those are plain strings that no
      # compiler or test validates.
      - name: Check plugin wiring
        run: bash scripts/check-plugin-wiring.sh

      # Confirms the root marketplace manifest — what `claude plugin
      # marketplace add` reads — still agrees with the plugins it publishes.
      # Its every field is a copy of something owned elsewhere.
      - name: Check marketplace manifest
        run: bash scripts/check-marketplace.sh

      # The dispatcher shipped as bin/<name> in every plugin bundle picks the
      # binary for the running platform, so any one machine covers exactly one
      # of its branches. This fakes the rest.
      - name: Check plugin bin dispatcher
        run: bash scripts/check-bundle-dispatch.sh

  # Fork 7a: one job, one OS. A footprint is a property of the schema, not of the
  # platform, so a matrix would triple the cost to answer the same question — and
  # it would make "the footprint" an OS-indexed value.
  #
  # This is the only job that needs the plugin binaries staged where the
  # manifests point, so it runs `just build-*` first. `cargo build` alone is not
  # enough: it writes to `target/`, while `.mcp.json` names
  # `${CLAUDE_PLUGIN_ROOT}/bin/<name>`, and it is the `just` recipes that copy
  # them there.
  footprint:
    name: Plugin Footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate compares against the merge base, so the history it needs
          # must actually be in the checkout.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # `taiki-e/install-action` is the family this workflow already uses for
      # nextest and cargo-deny; keeping to it avoids introducing a second way of
      # putting a tool on PATH.
      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build plugin binaries
        run: |
          just build-rtk-mcp-cc
          just build-re-ghidra-mcp-cc

      # Freshness: a committed document that no longer matches a fresh
      # measurement is caught here, before any threshold is consulted.
      - name: Verify the committed footprints are not stale
        run: |
          just footprint-regen
          # --porcelain, not `git diff`: a diff cannot see an UNTRACKED file, so
          # a new plugin's document that was never `git add`ed would be
          # regenerated here, ignored by the check, read off disk by the gate,
          # and merged without ever entering the repository.
          if [ -n "$(git status --porcelain -- docs/footprints/)" ]; then
            echo "::error::Committed footprint documents are stale or incomplete. Run 'just footprint-regen', 'git add docs/footprints/', and commit."
            git status --porcelain -- docs/footprints/
            git --no-pager diff -- docs/footprints/
            exit 1
          fi

      # Thresholds, read from the branch being merged INTO (spec §6.2) so a
      # change cannot raise the ceiling it is judged against.
      - name: Check footprints against the merge base
        run: |
          cargo run -q -p plugin-footprint --bin footprint-gate -- \
            "origin/${{ github.base_ref || 'main' }}"

  # A plugin's entry points are reached two ways — an MCP server spawned
  # directly, and a hook that runs through a shell — and on Windows those two
  # routes resolve `bin/<name>` differently. Nothing here used to assemble a
  # plugin and start it, which is how 0.6.0 shipped a dispatcher that refused
  # MINGW: green on the direct route, fatal on the Git Bash one.
  #
  # This stages a host-only bundle from debug binaries and runs both routes, on
  # a real machine of each OS.
  bundle-smoke:
    name: Bundle Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # `shell: bash` on windows-latest is Git Bash — the very shell whose
      # resolution of an extensionless path this job exists to cover.
      - name: Assemble and probe each plugin
        shell: bash
        run: |
          # tr -d: the jq on the Windows image writes CRLF, and a plugin name
          # with a carriage return attached makes every path built from it wrong.
          for plugin in $(jq -r '.plugins[].name' .claude-plugin/marketplace.json | tr -d '\r'); do
            bash scripts/smoke-bundle.sh "$plugin"
          done

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny
        run: cargo deny check

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for spelling errors
        uses: crate-ci/typos@v1
